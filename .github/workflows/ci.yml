name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timekeeper
          POSTGRES_PASSWORD: timekeeper
          POSTGRES_DB: timekeeper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U timekeeper -d timekeeper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests rebuild this schema from the migrations on every run.
      TEST_DATABASE_URL: postgres://timekeeper:timekeeper@localhost:5432/timekeeper_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
