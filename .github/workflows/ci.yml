name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timekeeper
          POSTGRES_PASSWORD: timekeeper
          POSTGRES_DB: timekeeper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U timekeeper -d timekeeper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests rebuild this schema from the migrations on every run.
      TEST_DATABASE_URL: postgres://timekeeper:timekeeper@localhost:5432/timekeeper_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, for the secret scan
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Shell scripts (backup, restore, update, monitor ...) are part of the product: they must stay clean and tested.
      - name: Install tools for the script tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age shellcheck postgresql-client
      - name: shellcheck
        run: shellcheck --severity=warning infra/deploy/*.sh infra/backup/bin/*.sh scripts/*.sh
      - name: Script tests (backup, restore, usage report, update, off-server copy)
        env:
          PGHOST: localhost
          PGUSER: timekeeper
          PGPASSWORD: timekeeper
        run: |
          bash infra/deploy/test-backup-scripts.sh
          bash infra/deploy/test-usage-report.sh
          bash infra/deploy/test-update.sh
          bash infra/deploy/test-offsite.sh
      - name: Dependencies (server, worker, web app)
        run: node scripts/audit-deployed.mjs
      - name: Secrets in the code and the history
        run: bash scripts/check-secrets.sh
