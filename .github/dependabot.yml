# Weekly pull requests for updated dependencies. Security updates arrive as their own pull requests as soon as they exist.
# At most 3 are open at once, and minor and patch updates are grouped, so this never turns into noise.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The phone app (Expo SDK 57) needs exactly react 19.2.3 and react-native 0.86.3: React Native's renderer refuses to start
    # if react differs even by a patch. They move only with an Expo SDK upgrade, done by hand (web react and react-dom with them).
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
      - dependency-name: react-native
      # Every expo-* package is tied to the Expo SDK (57); an SDK upgrade moves them together, by hand.
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      # Other native libraries of the phone app are pinned to what Expo SDK 57 ships with; a major update needs the SDK upgrade too.
      - dependency-name: "@react-native-async-storage/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
