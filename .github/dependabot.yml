# Weekly pull requests for updated dependencies. Security updates arrive as their own pull requests as soon as they exist.
# At most 3 are open at once, and minor and patch updates are grouped, so this never turns into noise.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The phone app (Expo SDK 57) needs exactly react 19.2.x and react-native 0.86.x; moving them needs an Expo SDK upgrade,
    # done on purpose. Patch updates still arrive. Web-only react minors are then bumped by hand.
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: react-native
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
