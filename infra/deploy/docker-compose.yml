# Production stack: PostgreSQL, API, worker, admin web app, Caddy (HTTPS). Run from the repository root:
#   docker compose --env-file infra/deploy/.env -f infra/deploy/docker-compose.yml up -d --build
# Only ports 80 and 443 are open to the internet (Caddy). Everything else stays on the internal network.
# The API and worker use the limited login tk_app (password APP_DB_PASSWORD, created by app-login.sh); only the migration
# job connects as the database owner.
x-app-db: &app-db
  DATABASE_URL: postgres://tk_app:${APP_DB_PASSWORD:?run infra/deploy/app-login.sh first}@postgres:5432/timekeeper

x-app: &app
  build:
    context: ../..
    dockerfile: infra/deploy/Dockerfile
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    STORAGE_DIR: /data/storage
    TRUST_PROXY: "1"
  volumes:
    - storage:/data/storage
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    # Own image: PostgreSQL 16 + the backup tools (postgres.Dockerfile). Every finished WAL segment is encrypted with the
    # public age key and archived to ${PITR_DIR}; a daily base backup (pitr-setup.sh installs the schedule) makes
    # point-in-time recovery possible. archive_mode needs a restart of this container once.
    build:
      context: ../..
      dockerfile: infra/deploy/postgres.Dockerfile
    image: timekeeper-postgres:16
    restart: unless-stopped
    # Memory caps (not reservations): a runaway container is stopped by Docker instead of starving the others. Sized for a
    # 2 GB server; raise them with the server. Check real use with: docker stats --no-stream
    mem_limit: 1g
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/opt/timekeeper/infra/backup/bin/wal-archive.sh "%p" "%f"
      - -c
      - archive_timeout=240
      - -c
      - wal_compression=on
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_USER: timekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: timekeeper
      # the database superuser of this image is timekeeper (not postgres); the backup scripts connect as PGUSER
      PGUSER: timekeeper
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?run infra/deploy/pitr-setup.sh first}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-/pitr}
      BACKUP_PROD_DATA_DIR: /var/lib/postgresql/data
      BACKUP_PG_CONF_DIR: /var/lib/postgresql/data
      BACKUP_DUMP_DBS: timekeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${PITR_DIR:-/var/backups/timekeeper-pitr}:/pitr
      - pitrstate:/var/lib/timekeeper-backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timekeeper -d timekeeper"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://timekeeper:${POSTGRES_PASSWORD}@postgres:5432/timekeeper
    command: ["pnpm", "--filter", "@timekeeper/api", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-db
      NODE_ENV: production
      STORAGE_DIR: /data/storage
      TRUST_PROXY: "1"
    mem_limit: 640m
    command: ["node", "apps/api/dist/main.js"]

  worker:
    <<: *app
    environment:
      <<: *app-db
      NODE_ENV: production
      STORAGE_DIR: /data/storage
      TRUST_PROXY: "1"
      # Background jobs (recompute, retention deletes) may legitimately run longer than a web request.
      DB_STATEMENT_TIMEOUT_MS: "300000"
    mem_limit: 512m
    command: ["node", "apps/api/dist/worker.js"]

  web:
    <<: *app
    working_dir: /app/apps/web
    mem_limit: 640m
    command: ["pnpm", "start"]
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:3001

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 192m
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      # CADDYFILE=./Caddyfile.cloudflare in .env when the domain is behind Cloudflare (docs/security/cloudflare-digitalocean-caddy.md)
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web

volumes:
  pgdata:
  pitrstate:
  storage:
  caddy_data:
