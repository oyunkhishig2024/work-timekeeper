# Production stack: PostgreSQL, API, worker, admin web app, Caddy (HTTPS). Run from the repository root:
#   docker compose --env-file infra/deploy/.env -f infra/deploy/docker-compose.yml up -d --build
# Only ports 80 and 443 are open to the internet (Caddy). Everything else stays on the internal network.
x-app: &app
  build:
    context: ../..
    dockerfile: infra/deploy/Dockerfile
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://timekeeper:${POSTGRES_PASSWORD}@postgres:5432/timekeeper
    STORAGE_DIR: /data/storage
    TRUST_PROXY: "1"
  volumes:
    - storage:/data/storage
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: timekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: timekeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timekeeper -d timekeeper"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["pnpm", "--filter", "@timekeeper/api", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "apps/api/dist/main.js"]

  worker:
    <<: *app
    command: ["node", "apps/api/dist/worker.js"]

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["pnpm", "start"]
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:3001

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web

volumes:
  pgdata:
  storage:
  caddy_data:
