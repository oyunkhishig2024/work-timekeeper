# Timekeeper Work - PostgreSQL 16 settings for WAL archiving / point-in-time recovery.
# Install: copy to /etc/postgresql/16/main/conf.d/90-timekeeper-backup.conf (Debian/Ubuntu
# includes conf.d automatically), set the real script path below, then RESTART PostgreSQL once
# (wal_level and archive_mode need a restart; archive_command and archive_timeout only a reload).
# PRD 25.2: RPO <= 15 minutes.

# --- WAL archiving -----------------------------------------------------------------------
wal_level = replica          # minimum for archiving + pg_basebackup (default since PG10)
archive_mode = on
# Scripts must be root-owned and NOT writable by the postgres user. Env file: /etc/timekeeper-backup.env
archive_command = '/opt/timekeeper/infra/backup/bin/wal-archive.sh "%p" "%f"'
# Close a WAL segment at least every 4 minutes when there was activity (bin/wal-heartbeat.sh
# keeps a quiet database "active"). Worst-case loss = archive_timeout + upload time, far below
# the 15 minute RPO. Do not set it below ~60 s: every switch is a 16 MB segment (gzip makes the
# mostly empty ones a few KB, but each is a separate remote object).
archive_timeout = 240
wal_compression = on         # smaller WAL (full page images are compressed)
archive_cleanup_command = '' # only used on standbys

# --- needed by pg_basebackup (defaults are fine; shown so nobody lowers them) --------------------
max_wal_senders = 4          # >= 2: one for pg_basebackup (data) and one for its WAL stream
# pg_hba.conf must allow:  local  replication  postgres  peer   (Debian default already does)

# --- NOTE: data checksums --------------------------------------------------------------------
# data_checksums cannot be set here. New clusters: initdb --data-checksums. Existing cluster:
# stop it and run  pg_checksums --enable -D <datadir>  (offline, minutes per 100 GB). With
# checksums, pg_basebackup verifies every page it copies, so silent disk corruption is not
# backed up unnoticed. Check:  SHOW data_checksums;
