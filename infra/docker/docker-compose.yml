# Local development database. Production uses a managed PostgreSQL (Singapore).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: timekeeper
      POSTGRES_PASSWORD: timekeeper
      POSTGRES_DB: timekeeper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
volumes:
  pgdata:
