# nginx in front of the Timekeeper Work API (runs on the Hostinger VPS, behind Cloudflare).
#   Internet -> Cloudflare (WAF, DDoS, TLS) -> nginx (this file: coarse limits, slow-client protection) -> API on 127.0.0.1:3001
# Put the http-level part in /etc/nginx/conf.d/timekeeper-http.conf and the server blocks in sites-enabled.
# Replace api.example.mn and the certificate paths. The API must run with TRUST_PROXY=1 (one hop: this nginx).

############################ http level ############################

# 1. The real client address. Cloudflare connects from its own ranges and puts the visitor in CF-Connecting-IP.
#    Keep this list current: curl https://www.cloudflare.com/ips-v4 and /ips-v6 (infra/hostinger/allow-cloudflare-only.sh does it
#    for the firewall; regenerate this include with the same data). With cloudflared (Tunnel) the peer is 127.0.0.1 instead.
include /etc/nginx/cloudflare-realip.conf;     # lines: set_real_ip_from <cidr>;   (one per Cloudflare range, plus 127.0.0.1 for a Tunnel)
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# 2. Coarse per-address limits. The API's adaptive protection (apps/api/src/security) does the clever part;
#    these only stop a single address from drowning nginx or Node.
limit_req_zone  $binary_remote_addr zone=api_all:20m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api_auth:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# 3. Slow-client (Slowloris) and oversized-request protection.
client_header_timeout 10s;
client_body_timeout   15s;
send_timeout          15s;
keepalive_timeout     30s;
client_header_buffer_size   2k;
large_client_header_buffers 4 8k;
reset_timedout_connection on;
server_tokens off;

# 4. Upstream with keep-alive to Node.
upstream timekeeper_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# 5. Unknown host names (someone hitting the VPS address directly, or a wrong Host header) get nothing.
server {
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;     # Cloudflare Origin CA certificate (or Let's Encrypt)
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    return 444;
}

############################ the API ############################

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.mn;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Only Cloudflare may talk to this server: "Authenticated Origin Pulls" (Cloudflare presents a client certificate).
    # Download cloudflare's origin-pull CA to the path below, then turn it on in the dashboard (SSL/TLS > Origin Server).
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;

    # Biggest legitimate bodies: consent scans 10 MB, holiday import 5 MB. Everything else is small JSON.
    client_max_body_size 11m;

    limit_req  zone=api_all burst=60 nodelay;
    limit_conn api_conn 40;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Sign-in endpoints get a much lower allowance than the rest.
    location /v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        include /etc/nginx/snippets/timekeeper-proxy.conf;
    }

    # Everything else (including probes like /.env: they are passed on so that the application can SEE and score them).
    location / {
        include /etc/nginx/snippets/timekeeper-proxy.conf;
    }
}

